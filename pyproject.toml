[project]
name = "prettymapp"
version = "0.7.0"
description = "Create beautiful maps from OpenStreetMap data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christoph Rieke", email = "christoph.k.rieke@gmail.com" }]
keywords = ["art", "map", "cartography", "osm", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
]
# osmnx <3: major osmnx releases reorganize the API surface (1.x -> 2.x did),
# geopandas & shapely are used directly, so declared directly.
dependencies = [
    "matplotlib>=3.10.8",
    "osmnx>=2.0.7,<3",
    "pandas>=2.3.3",
    "geopandas>=1.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
streamlit = ["streamlit", "streamlit-image-select"]

[dependency-groups]
dev = [
    "black",
    "pylint==3.1.0",
    "mock",
    "types-mock",
    "pytest",
    "pytest-pylint",
    "pytest-sugar",
    "pytest-mypy",
    "mypy==1.9.0",
    "mypy-extensions",
    "twine",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# Specifically define package, doesn't know if prettymapp or cache
[tool.setuptools]
package-dir = { "" = "." }
include-package-data = false
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prettymapp*"]
exclude = ["prettymapp.tests*"]

[tool.setuptools.package-data]
prettymapp = ["fonts/PermanentMarker-Regular.ttf"]

[project.urls]
Homepage = "https://github.com/chrieke/prettymapp"
Changelog = "https://github.com/chrieke/prettymapp/changelog"
